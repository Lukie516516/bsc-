// GET /api/get_address_box — 与 GetNftMintedByAddressPage 筛选一致（internal/biz GetAddressBox）
message GetAddressBoxRequest {
  uint64 start = 7;      // 可选：铸造时间 block_time 下限（须与 end 同时 >0 才按时间筛）
  uint64 end = 8;        // 可选：铸造时间 block_time 上限
  string address = 3;    // 用户钱包 0x…
  uint64 page = 1;       // 页码从 1 起，每页 10 条
  uint64 num = 2;        // 上架：0=仅未上架（仓库）；1=仅挂单中；≥2=不按上架筛
  uint64 numTwo = 5;     // 档位：0=全档位；1=tier1(20U)；2=tier2(50U)；3=tier3(100U)
  uint64 numThree = 4;   // id 排序：0=倒序；1=正序
  uint64 numFour = 9;    // 开盒时间：0=不附加；1=opened_at 倒序；>1=opened_at 正序
  uint64 openStatus = 6; // 开盒：0=仅未开盒；1=仅已开盒；≥2=不按开盒筛
  // 出售/挂单成功后前端可传入，在链上/库未同步前先从本页列表中排除（乐观更新）
  repeated uint64 exclude_token_ids = 10;
}

message GetAddressBoxReply {
  uint64 count = 2; // 总数，每页10
  repeated List list = 1;
  message List {
    uint64 tokenId = 2; // tokenId
    double priceUsdt = 3; // 金额
    uint64 tier = 7; // 1表示20 ，2表示50，3表示100
    double priceUsdtNow = 4; // 目前增长金额
    uint64 blockTime = 5; // 铸造时间
    uint64 listTime = 6; // 上架时间
    uint64 openStatus = 8;
    uint64 openTime = 9;
    string minter = 10;
    // NFT 合约 boxInfo：链上结算结果（与 PrincipalVault.principalInfo 独立；金库未写入时仍可能已结算）
    double box_reward_usdt = 11; // reward / 1e18，可负；未结算时为 0
    uint64 reward_set_at = 12;   // rewardSetAt，0 表示链上尚未 setRewardOnce
    double chain_usdt_paid = 13; // 链上 boxInfo.usdtPaid / 1e18，作本金展示兜底
  }
}

message GetMarketListRequest {
