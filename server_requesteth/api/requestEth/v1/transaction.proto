message GetAllInfoReply {
  uint64 userCount = 1; // 用户注册总数
  uint64 todayUserCount = 2; // 今日新增用户总数
  uint64 todayMintedCount = 3; // 今日铸造量
  string todayMintedSum = 4; // 今日铸造金额
  uint64 mintedCount = 5; // 总铸造量
  string mintedSum = 6; // 总铸金额
  uint64 mintedCountNoOpen = 115; // 已铸造量未打卡
  string mintedSumNoOpen = 116; // 已铸金额未打卡

  uint64 mintedCountOne = 7; // 总铸造量1档
  string mintedSumOne = 8; // 总铸金额1档

  uint64 mintedCountTwo = 9; // 总铸造量2档
  string mintedSumTwo = 10; // 总铸金额2档

  uint64 mintedCountThree = 11; // 总铸造量3档
  string mintedSumThree = 12; // 总铸金额3档

  uint64 buyCount = 13; // 历史销售总量
  string buySum = 14; // 历史销售金额

  uint64 todayBuyCount = 15; // 今日历史销售总量
  string todayBuySum = 16; // 今日历史销售金额

  string openReward = 17; // 盲盒总盈利
}

// 铸造分佣待发列表
message ReferralListPendingRequest {
  int32 page = 1;
  int32 page_size = 2;  // 默认20
  bool paid = 3;        // true=已打款 false=待打款 不传=全部
}

message ReferralListPendingReply {
  int64 total = 1;
  repeated ReferralPendingItem list = 2;
}

message ReferralPendingItem {
  uint64 id = 1;
  uint64 minted_id = 15;   // nft_minted.id（铸造分佣来源）
  uint64 purchase_id = 2;  // 历史兼容，新记录为 0
  uint64 token_id = 3;
  string minter = 4;
  string seller = 5;
  string buyer = 6;
  string price = 7;
  string addr_b = 8;
  string addr_c = 9;
  string amount_to_b = 10;
  string amount_to_c = 11;
  string amount_to_project = 12;
  uint32 reason = 13;   // 0正常 1仅D不合格 2仅B不合格 3无上级 4都不合格
  string paid_tx_hash = 14;
}

message ReferralPayoutRequest {
  message SendBody {
    repeated uint64 ids = 1;       // referral_pending.id 列表
    string usdt_address = 2;      // USDT 合约地址，可选
    string rpc_url = 3;           // RPC URL，可选
  }
  SendBody send_body = 1;
}

message ReferralPayoutReply {
  int32 paid_count = 1;
  repeated string tx_hashes = 2;
  string err = 3;
}

// 按日开盒利润统计
message GetOpenedBoxProfitStatsRequest {
  uint64 start = 1;  // 开始时间戳（秒）
  uint64 end = 2;    // 结束时间戳（秒）
  int32 page = 3;
  int32 page_size = 4;  // 默认 20
}

message GetOpenedBoxProfitStatsReply {
  int64 total = 1;
  string total_profit = 2;   // 时间段内利润总和（reward 代数和，可正可负）
  uint64 profit_count = 3;   // 盈利盲盒数
  uint64 loss_count = 4;     // 亏损盲盒数
  repeated GetOpenedBoxProfitStatsReply_Item list = 5;
}

message GetOpenedBoxProfitStatsReply_Item {
  uint64 token_id = 1;
  string user_addr = 2;
  string reward = 3;         // 正为盈利，负为亏损
  string usdt_paid = 4;      // 铸造本金
  uint64 block_time = 5;
}

// 手续费收入统计（二级市场交易）
message GetFeeIncomeStatsRequest {
  uint64 start = 1;
  uint64 end = 2;
}

message GetFeeIncomeStatsReply {
  string fee_usdt_sum = 1;   // USDT 手续费总和
  string fee_b_sum = 2;       // HRX 手续费总和
  uint64 count = 3;           // 交易笔数
}