# requestEth 一键部署：API + Workers + MySQL + Redis
# 使用：cp .env.example .env 并填写私钥/合约地址，然后 docker compose up -d

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: game
    ports:
      - "3307:3306"   # 宿主机 3307，避免与已有 MySQL(3306) 冲突
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8000"   # HTTP，宿主机 8003
      - "9003:9000"   # gRPC，宿主机 9003
    volumes:
      - ./docker/configs:/data/conf:ro
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./requestEth", "-conf", "/data/conf"]
    healthcheck:
      # 使用 127.0.0.1，避免部分环境 localhost 解析到 ::1 而 HTTP 仅监听 IPv4 导致一直 unhealthy
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  blind_settle_worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./docker/configs:/data/conf:ro
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./blind_settle_worker", "-conf", "/data/conf"]

  referral_worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./docker/configs:/data/conf:ro
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./referral_worker", "-conf", "/data/conf"]

  rebalance_worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./docker/configs:/data/conf:ro
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./rebalance_worker", "-conf", "/data/conf"]

volumes:
  mysql_data:
